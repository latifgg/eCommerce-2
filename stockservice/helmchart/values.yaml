replicaCount: 1

image:
  repository: latifbey/stock-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8084

env:
  MONGODB_URI: "mongodb://mongodb:27017/stockdb"

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"
serviceAccount:
  create: false
ingress:
  enabled: false
autoscaling:
  enabled: false
