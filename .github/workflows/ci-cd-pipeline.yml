name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - e-commerce-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew in all services
        run: |
          chmod +x userservice/gradlew
          chmod +x productservice/gradlew
          chmod +x orderservice/gradlew
          chmod +x gatewayAPI/gradlew

      - name: Build User Service
        run: |
          cd userservice
          ./gradlew build
          cd ..

      - name: Build Product Service
        run: |
          cd productservice
          ./gradlew build
          cd ..

      - name: Build Order Service
        run: |
          cd orderservice
          ./gradlew build
          cd ..

      - name: Build API Gateway
        run: |
          cd gatewayAPI
          ./gradlew build
          cd ..

      - name: Build Docker images
        run: |
          docker build -t latifbey/api-gateway:latest ./gatewayAPI
          docker build -t latifbey/order-service:latest ./orderservice
          docker build -t latifbey/product-service:latest ./productservice
          docker build -t latifbey/user-service:latest ./userservice

      - name: Push Docker images to DockerHub
        run: |
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
          docker push latifbey/api-gateway:latest
          docker push latifbey/order-service:latest
          docker push latifbey/product-service:latest
          docker push latifbey/user-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Create Kubernetes Cluster (Kind)
        uses: helm/kind-action@v1.8.0

      - name: Deploy to Kubernetes
        run: |
          cd helmchart/ecommerce
          helm upgrade --install ecommerce .

          # Check deployment status
          kubectl get pods
          kubectl get svc
          kubectl get ingress
