name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - e-commerce-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build Docker images
        run: |
          docker build -t latifbey/api-gateway:latest ./gatewayAPI
          docker build -t latifbey/order-service:latest ./orderservice
          docker build -t latifbey/product-service:latest ./productservice
          docker build -t latifbey/user-service:latest ./userservice

      - name: Push Docker images to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push latifbey/api-gateway:latest
          docker push latifbey/order-service:latest
          docker push latifbey/product-service:latest
          docker push latifbey/user-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_TOKEN }}" | kubectl config set-credentials github-actions --token=$(cat -)
          kubectl config set-cluster docker-desktop --server=https://kubernetes.default.svc
          kubectl config set-context default --cluster=docker-desktop --user=github-actions
          kubectl config use-context default

      - name: Deploy to Kubernetes
        run: |
          cd helmchart/ecommerce
          helm upgrade --install ecommerce . 
          kubectl rollout restart deployment/api-gateway-helmchart
          kubectl rollout restart deployment/order-service-helmchart
          kubectl rollout restart deployment/product-service-helmchart
          kubectl rollout restart deployment/user-service-helmchart
