version: "3.8"

services:
  postgresql:
    image: postgres:15
    container_name: postgres-db  # ❗Bunu değiştirmene gerek yok, sadece servis adını değiştirdik.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  user-service:
    image: latifbey/user-service:latest  # ✅ Docker Hub için image eklendi
    build: ./userservice
    container_name: user-service
    ports:
      - "8083:8083"
    depends_on:
      - postgresql  # ✅ Postgres adı düzeltildi
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  product-service:
    image: latifbey/product-service:latest  # ✅ Docker Hub için image eklendi
    build: ./productservice
    container_name: product-service
    ports:
      - "8082:8082"
    depends_on:
      - postgresql
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  order-service:
    image: latifbey/order-service:latest  # ✅ Docker Hub için image eklendi
    build: ./orderservice
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - postgresql
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  api-gateway:
    image: latifbey/api-gateway:latest  # ✅ Docker Hub için image eklendi
    build: ./gatewayAPI
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  postgres_data:
